# Local PostgreSQL for running the CLI by hand (tests use testcontainers instead).
#   docker compose up -d
#   export PIPELINE_DATABASE_URL=postgresql://pipeline:pipeline@localhost:5432/pipeline
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: pipeline
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline"]
      interval: 2s
      retries: 15
