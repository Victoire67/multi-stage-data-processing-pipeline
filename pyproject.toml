[project]
name = "text-pipeline"
version = "1.0.0"
description = "Multi-stage text processing pipeline: clean -> analyze sentiment -> store in PostgreSQL."
authors = [{ name = "victoire67", email = "ansimavicky@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<4.0"
dependencies = ["psycopg[binary] (>=3.3.6,<4.0.0)"]

[project.scripts]
text-pipeline = "text_pipeline.cli:main"

[tool.poetry]
packages = [{ include = "text_pipeline", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "D",   # pydocstyle (docstrings everywhere)
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific rules
]
ignore = [
    "D203", # one-blank-line-before-class (conflicts with D211)
    "D213", # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D104"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["text_pipeline"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that need Docker (testcontainers spins up PostgreSQL)",
]

[tool.coverage.run]
source = ["text_pipeline"]
omit = ["*/__main__.py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-mock (>=3.17.0,<4.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "coverage (>=7.16.2,<8.0.0)",
    "testcontainers[postgres] (>=4.15.0,<5.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "ruff (>=0.17.1,<0.18.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)"
]
