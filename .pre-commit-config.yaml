# Install once with:  poetry run pre-commit install
# Run on everything:  poetry run pre-commit run --all-files
# Generated coverage HTML is committed as-is.
exclude: ^docs/coverage/html/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: debug-statements # blocks forgotten breakpoint()/pdb imports
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.1
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]

  # mypy runs from the project's virtualenv so it sees the real dependencies.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: poetry run mypy
        language: system
        types: [python]
        pass_filenames: false
